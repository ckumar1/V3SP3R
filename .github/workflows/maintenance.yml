name: Maintenance regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and run targeted regression tests
        run: >-
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest
          --tests '*FlipperAppCatalogTest' --tests '*CommandLockTest'
          --tests '*BleRpcTransportTest' --tests '*BleSetupSequenceTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
